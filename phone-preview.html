<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exchange phone preview</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #080a0c;
            color: #eaecef;
            font: 13px Arial, sans-serif;
        }
        main { display: grid; gap: 12px; justify-items: center; padding: 16px; }
        p { margin: 0; color: #aeb4bc; }
        .device {
            width: 390px;
            height: min(844px, calc(100vh - 80px));
            min-height: 650px;
            overflow: hidden;
            border: 8px solid #282e36;
            border-radius: 32px;
            background: #0b0e11;
            box-shadow: 0 18px 70px #000a;
        }
        iframe { display: block; width: 100%; height: 100%; border: 0; background: #0b0e11; }
    </style>
</head>
<body>
    <main>
        <p>Phone preview · 390 × 844</p>
        <div class="device">
            <iframe src="./index.html" title="Exchange phone layout"></iframe>
        </div>
    </main>
</body>
</html>
